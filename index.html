<title>Essay Fix Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Lexend:wght@400;500;700&family=Noto+Kufi+Arabic:wght@400;600&display=swap">
<style>
/* Layout: one working column (max 1040px) under a sticky stage rail; each stage is a stack of task cards. Wine + sage, new for this series. */
:root{
  --bg:#F6F3F4; --surface:#FFFFFF; --ink:#24161B; --muted:#6A5A60; --line:#E2D6DA;
  --wine:#7A2142; --wine-ink:#FFFFFF; --wine-soft:#F4E2E8;
  --sage:#3F6B4C; --sage-soft:#E1EDE4;
  --good:#2C7A45; --good-soft:#DFF1E4; --bad:#B3261E; --bad-soft:#FBE3E0; --gold:#9A6A00; --gold-soft:#F8EDD2;
  --display:"Outfit","Trebuchet MS",system-ui,sans-serif;
  --body:"Lexend",Verdana,system-ui,sans-serif;
  --arabic:"Noto Kufi Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171013; --surface:#22181C; --ink:#F1E8EB; --muted:#B8A6AD; --line:#3A2B31;
  --wine:#E58AA9; --wine-ink:#2A0C17; --wine-soft:#3D1A27; --sage:#8FC39E; --sage-soft:#1D3325;
  --good:#7BD79A; --good-soft:#193A26; --bad:#FF8A80; --bad-soft:#3E1C1A; --gold:#F0C35A; --gold-soft:#3A2D12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171013; --surface:#22181C; --ink:#F1E8EB; --muted:#B8A6AD; --line:#3A2B31;
  --wine:#E58AA9; --wine-ink:#2A0C17; --wine-soft:#3D1A27; --sage:#8FC39E; --sage-soft:#1D3325;
  --good:#7BD79A; --good-soft:#193A26; --bad:#FF8A80; --bad-soft:#3E1C1A; --gold:#F0C35A; --gold-soft:#3A2D12; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.12;text-wrap:balance;margin:0}
h2{font-size:clamp(1.7rem,3.6vw,2.3rem)} h3{font-size:1.25rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ar{font-family:var(--arabic);font-size:.82em;color:var(--muted);direction:rtl;unicode-bidi:isolate}
body:not(.show-ar) .ar.opt{display:none}

header.top{padding-block:18px 12px;border-bottom:1px solid var(--line)}
.hrow{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.brand h1{font-size:clamp(1.8rem,4.2vw,2.5rem);letter-spacing:-.01em;font-weight:800}
.brand small{display:block;font-size:.9rem;color:var(--muted)}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hud input{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;width:190px;max-width:100%}
.pts{font-family:var(--display);font-weight:700;font-size:1.2rem;background:var(--wine);color:var(--wine-ink);padding:6px 14px;border-radius:999px;font-variant-numeric:tabular-nums}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--wine)}
.btn.main{background:var(--wine);color:var(--wine-ink);border-color:var(--wine);font-weight:700}
.btn.small{padding:5px 11px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.badge{font-size:.84rem;padding:3px 10px;border-radius:999px;border:1.5px dashed var(--line);color:var(--muted)}
.badge.on{border-style:solid;border-color:var(--sage);background:var(--sage-soft);color:var(--ink);font-weight:700}

nav.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.rail .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:9px}
.rail button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:.92rem;display:flex;gap:7px;align-items:center}
.rail .n{font-family:var(--display);font-weight:700;color:var(--muted)}
.rail button.cur{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rail button.cur .n{color:inherit}
.rail button.done::after{content:"✓";color:var(--good);font-weight:700}

main{padding-block:24px 40px;display:grid;gap:20px}
.intro{display:grid;gap:8px;max-width:70ch}
.intro p{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;min-width:0}
.tip{background:var(--sage-soft);border-radius:12px;padding:12px 16px;font-size:.98rem}
.tip.wine{background:var(--wine-soft)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:.9rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.mapc{border-radius:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);display:grid;gap:4px;border-top:5px solid var(--wine)}
.mapc b{font-family:var(--display);font-size:1.6rem;color:var(--wine);line-height:1}
.gloss{display:flex;flex-wrap:wrap;gap:8px}
.gloss span{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.92rem;display:inline-flex;gap:8px;align-items:baseline;background:var(--surface)}

.item{border:1.5px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;background:var(--surface);min-width:0}
.item.ok{border-color:var(--good);background:var(--good-soft)}
.item.no{border-color:var(--bad)}
.item .q{font-weight:500}
.tag{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--wine-soft);color:var(--wine);margin-right:6px}
.opts{display:grid;gap:8px}
.opts.row4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.opts button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 13px;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--wine)}
.opts button.right{border-color:var(--good);background:var(--good-soft)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opts button:disabled{cursor:default}
.fb{font-size:.94rem}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
select.in,input.in{border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--bg);max-width:100%}
input.in{width:11em}
select.in.ok,input.in.ok{border-color:var(--good);background:var(--good-soft)}
select.in.no,input.in.no{border-color:var(--bad);background:var(--bad-soft)}
.sent{line-height:2.3}
.para{background:var(--sage-soft);border-radius:12px;padding:14px 16px;line-height:1.7}
.para .s1{font-weight:700}
textarea.big{width:100%;min-height:4.5em;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);resize:vertical;line-height:1.6}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.checks li::before{content:"";flex:none;width:18px;height:18px;margin-top:3px;border-radius:5px;border:2px solid var(--line)}
.checks li.on::before{background:var(--good);border-color:var(--good)}
.spell{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.spell .item .wrongw{font-size:1.15rem;color:var(--bad);text-decoration:line-through}
.tokline{display:flex;flex-wrap:wrap;gap:2px 0;font-size:1.08rem;line-height:1.9}
.tok{border:none;background:transparent;padding:1px 4px;border-radius:6px;cursor:pointer;font:inherit;color:inherit}
.tok:hover:not(:disabled){background:var(--wine-soft)}
.tok:disabled{cursor:default}
.tok.err{background:var(--bad-soft);text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.tok.picked{outline:2px solid var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.tblwrap{overflow-x:auto}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
.tbl th{font-size:.82rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.score{font-family:var(--display);font-size:3rem;font-weight:800;color:var(--wine);font-variant-numeric:tabular-nums}
.cert{border:3px double var(--sage);border-radius:18px;padding:28px 20px;text-align:center;display:grid;gap:10px;background:var(--surface)}
.cert .who{font-family:var(--display);font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;color:var(--wine);border-bottom:2px solid var(--line);justify-self:center;min-width:min(100%,320px)}
footer{border-top:1px solid var(--line);padding-block:16px 26px;color:var(--muted);font-size:.9rem;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.shake{animation:none}}
</style>

<header class="top"><div class="wrap">
  <div class="hrow">
    <div class="brand">
      <svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><rect x="2" y="2" width="44" height="44" rx="10" fill="var(--wine-soft)"/><rect x="10" y="10" width="22" height="4" rx="2" fill="var(--wine)"/><rect x="10" y="18" width="28" height="4" rx="2" fill="var(--sage)"/><rect x="10" y="26" width="28" height="4" rx="2" fill="var(--sage)"/><rect x="10" y="34" width="16" height="4" rx="2" fill="var(--wine)"/><path d="M30 37 l4 4 l8 -10" stroke="var(--good)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1>Essay Fix Lab</h1><small>Problem-solution essay follow-up · IELTS Writing Task 2</small></div>
    </div>
    <div class="hud">
      <label for="name" class="note">Your name</label>
      <input id="name" placeholder="Type your name" autocomplete="off">
      <span class="pts" id="pts">0 pts</span>
      <button class="btn small" id="arBtn" type="button">عربي</button>
    </div>
  </div>
  <div class="badges" id="badges"></div>
</div></header>
<nav class="rail" aria-label="Stages"><div class="wrap" id="rail"></div></nav>
<main class="wrap" id="main"></main>
<footer><div class="wrap">
  <div class="row" style="justify-content:center;margin-bottom:10px">
    <button class="btn small" id="saveBtn" type="button">Save my progress</button>
    <button class="btn small" id="loadBtn" type="button">Load progress file</button>
  </div>
  Designed by: Nazila Motahari
</div></footer>
<canvas id="confetti" hidden></canvas>
<input type="file" id="loadFile" accept=".json,application/json" hidden>

<script>
/* ===================== CONTENT (all sentences come from our class's essays) ===================== */
const PARTS=["Introduction","Body 1: causes or problems","Body 2: solutions","Conclusion"];
const MAP=[
 {id:"m1",s:"Nowadays, traffic congestion has become a serious problem in many cities in the world.",a:0,why:"It introduces the topic: a paraphrase of the question."},
 {id:"m2",s:"One main cause is eating lots of fast food.",a:1,why:"'One main cause is …' starts a cause."},
 {id:"m3",s:"One solution is to provide more PE lessons in schools.",a:2,why:"'One solution is to …' starts a solution."},
 {id:"m4",s:"To sum up, obesity has become a serious issue because of fast food and lack of exercise.",a:3,why:"'To sum up' + a summary of the causes."},
 {id:"m5",s:"Another cause is that some people live far from their workplace.",a:1,why:"'Another cause is …' belongs with the causes."},
 {id:"m6",s:"Many employers prefer to hire experienced workers because they require less training.",a:1,why:"It explains WHY graduates cannot find jobs: a cause."},
 {id:"m7",s:"Restaurants and supermarkets can use applications to sell extra food at lower prices.",a:2,why:"It says HOW to reduce food waste: a solution."},
 {id:"m8",s:"In this essay, I will discuss the main causes of this problem and suggest some solutions.",a:0,why:"This is the outline sentence at the end of the introduction."},
 {id:"m9",s:"In conclusion, food is wasted because people buy too much, but this can be reduced.",a:3,why:"'In conclusion' + causes + solutions, in one sentence."},
 {id:"m10",s:"One solution: when you spend a lot of time on screens, you lose attention.",a:1,why:"Careful! It says 'solution', but losing attention is a PROBLEM."}
];
const IC=[
 {id:"i1",q:"Which outline sentence is correct?",o:["In this essay, I will discuss the main causes of this problem and suggest some solutions.","In this essay will discuss the main causes of this problem and suggest some solutions.","In this essay, I will short the main causes of this problem and some solutions."],why:"Every sentence needs a subject (I), and the verb is 'discuss'."},
 {id:"i2",q:"The question: \"Young people spend many hours a day on their phones. What problems does this cause, and what are some solutions?\" Which outline fits?",o:["In this essay, I will discuss the main problems this causes and suggest some solutions.","In this essay, I will discuss the main causes of this habit and give my opinion.","In this essay, I will discuss the advantages and disadvantages of phones."],why:"The question asks for PROBLEMS and solutions, so the outline says 'problems'."},
 {id:"i3",q:"The question says: \"Fewer young people read books for pleasure than in the past.\" Which is the best paraphrase?",o:["Nowadays, young people read books for enjoyment less often than before.","Fewer young people read books for pleasure than in the past.","Nowadays, young people read more books for pleasure than before."],why:"A paraphrase keeps the meaning but changes the words. The second one is copied, and the third changes the meaning."},
 {id:"i4",q:"Which sentence is correct?",o:["There are several reasons for this problem.","There are several for reasons this problem.","There is several for this problem."],why:"'several' needs a noun after it: several reasons."},
 {id:"i5",q:"Which is the best conclusion for a traffic essay?",o:["In conclusion, traffic is caused by too many cars, but better buses and car sharing can reduce it.","In conclusion, the government should also build more cycle lanes and allow working from home.","In conclusion, I will discuss the causes of traffic and suggest some solutions in this essay."],why:"A conclusion sums up causes and solutions. No new ideas, and no outline sentence."}
];
const CHAINS=[
 {id:"c1",idea:"Cities have poor public transport, which leads people to use private cars.",steps:[
   ["Explain",["Buses do not come often, so people prefer to drive.","Public transport is a very good and modern idea.","Many people enjoy listening to music in their cars."]],
   ["Example",["For example, in some areas people wait a long time for a bus.","For example, the government should build more roads.","For example, cars are more expensive than buses."]],
   ["Result",["As a result, thousands of cars enter the city every morning.","As a result, people should share cars with friends.","As a result, buses are cheaper than taxis."]]]},
 {id:"c2",idea:"One major cause of obesity is eating a lot of fast food.",steps:[
   ["Explain",["Fast food has unhealthy fats and a lot of sugar.","Fast food restaurants have nice decoration.","Many young people like to play football."]],
   ["Example",["For example, many students buy burgers and fizzy drinks on their way home.","For example, schools should offer more PE classes.","For example, salads are healthier than burgers."]],
   ["Result",["As a result, they gain weight and may develop diabetes.","As a result, fast food restaurants become very busy.","As a result, they should cook at home more often."]]]},
 {id:"c3",idea:"One solution is to include an internship in every degree.",steps:[
   ["Explain",["This would give students real work experience before they graduate.","This is because many graduates cannot find a job.","Universities are very important for young people."]],
   ["Example",["For example, students could work in a company for three months in their final year.","For example, many companies prefer experienced workers.","For example, some graduates want only office jobs."]],
   ["Result",["If students gain experience, employers will be more willing to hire them.","If students graduate, they will receive a certificate.","If employers want experience, students will not find jobs."]]]}
];
const STRUCT=[
 {id:"s1",k:"If … will …",o:["If buses are cheaper, more people will use them.","If buses will be cheaper, more people use them.","If buses are cheaper, more people would used them."],why:"First conditional: If + present, will + verb."},
 {id:"s2",k:"If … will …",o:["If we do not solve this problem, we will face health problems.","If we didn't solve this problem, we will face health problems.","If we will not solve this problem, we face health problems."],why:"If + present (do not solve), will + verb."},
 {id:"s3",k:"If … will …",o:["If schools teach cooking, students will eat better.","If schools will teach cooking, students eat better.","If schools teaching cooking, students will eat better."],why:"No 'will' after 'if'."},
 {id:"s4",k:"should be + past participle",o:["New roads should be built to reduce traffic.","New roads should built to reduce traffic.","New roads should be build to reduce traffic."],why:"should + be + past participle: built."},
 {id:"s5",k:"should be + past participle",o:["Sugary drinks should be taxed by the government.","Sugary drinks should be tax by the government.","Sugary drinks should taxed by the government."],why:"should + be + past participle: taxed."},
 {id:"s6",k:"should be + past participle",o:["Phones should be banned during lessons.","Phones should banned during lessons.","Phones should be ban during lessons."],why:"should + be + past participle: banned."},
 {id:"s7",k:"in order to …",o:["Schools should offer more PE classes in order to encourage exercise.","Schools should offer more PE classes in order encourage exercise.","Schools should offer more PE classes in order to encouraging exercise."],why:"in order to + base verb."},
 {id:"s8",k:"in order to …",o:["People can share cars in order to reduce traffic.","People can share cars in order for reduce traffic.","People can share cars in order reducing traffic."],why:"in order to + base verb."},
 {id:"s9",k:"in order to …",o:["Universities should offer internships in order to give students experience.","Universities should offer internships for to give students experience.","Universities should offer internships in order to giving students experience."],why:"in order to + base verb (give)."}
];
const OWN=[
 {id:"w1",k:"If … will …",ph:"If ..., ... will ...",ex:"If schools sell fruit instead of sweets, students will eat more healthily.",test:t=>/\bif\b/i.test(t)&&/\bwill\b/i.test(t)&&!/\bif\b[^,]*\bwill\b/i.test(t)},
 {id:"w2",k:"should be + past participle",ph:"... should be ...",ex:"More bus lanes should be built in the city centre.",test:t=>/\bshould\s+be\s+(\w+(ed|en|t|wn)|made|done|put|cut|set|sold|paid|taught|kept|bought|held|run|found|told|shut)\b/i.test(t)},
 {id:"w3",k:"in order to …",ph:"... in order to ...",ex:"Companies could allow working from home in order to reduce traffic.",test:t=>/\bin order to\s+\w+/i.test(t)&&!/\bin order to\s+\w+ing\b/i.test(t)}
];
const RUN=[
 {id:"r1",o:["People spend a long time on the road. In addition, some roads were closed for repairs.","People spend a long time on the road, In addition, some roads were closed for repairs.","People spend a long time on the road in addition, some roads were closed for repairs."],why:"A new idea starts a new sentence: full stop, then 'In addition'."},
 {id:"r2",o:["Children lack exercise, which results in laziness.","Children lack exercise. Which results in laziness.","Children lack of exercise. Which results in laziness."],why:"'which …' cannot be a sentence alone. Join it with a comma."},
 {id:"r3",o:["Schools should provide healthy meals in order to give students a balanced diet.","Schools should provide healthy meals. In order to give students a balanced diet.","Schools provide healthy meals. In order to give students a balanced diet."],why:"'In order to …' has no subject or main verb, so it joins the sentence before."},
 {id:"r4",o:["Every morning, many people go to work at the same time, so the roads become crowded.","Many people every morning they go to work at the same time, so the roads become crowded.","Every morning, many people go to work at the same time the roads become crowded."],why:"One subject (not 'people … they'), and 'so' joins the two ideas."}
];
const VERB=[
 {id:"v1",s:"The government should encourage people __ public transport.",o:["to use","use","using"]},
 {id:"v2",s:"Young people are getting used to __ unhealthy food.",o:["eating","eat","ate"]},
 {id:"v3",s:"We can solve this problem by __ more bus lines.",o:["building","build","to build"]},
 {id:"v4",s:"Obesity __ a widely discussed issue in recent years.",o:["has become","become","becoming"]},
 {id:"v5",s:"Some people __ far from their workplace.",o:["live","lives","living"]},
 {id:"v6",s:"Fast food is popular because it __ good.",o:["tastes","taste","tasting"]},
 {id:"v7",s:"Lack of exercise __ to obesity.",o:["leads","lead","leading"]}
];
const SPELL=[["triffic","traffic","حركة المرور"],["slotion","solution","حل"],["goverment","government","حكومة"],["proplem","problem","مشكلة"],["exerise","exercise","تمارين رياضية"],["suger","sugar","سكر"],["encourge","encourage","يشجع"],["awarness","awareness","وعي"]];
const FF=[
 {id:"x1",s:"Traffic congestion has a serious problem in many cities.",e:"has",o:["is","have","was having"],why:"Traffic congestion IS a problem (or 'has become a serious problem')."},
 {id:"x2",s:"In this essay, will discuss the main causes of this problem.",e:"will",o:["I will","it will","will be"],why:"Every sentence needs a subject: I will discuss."},
 {id:"x3",s:"Lack of exercise lead to obesity.",e:"lead",o:["leads","leading","is lead"],why:"Singular subject + leads."},
 {id:"x4",s:"The government should encourage people use public transport.",e:"use",o:["to use","using","used"],why:"encourage + person + to + verb."},
 {id:"x5",s:"If we didn't solve this problem, we will face health problems.",e:"didn't solve",o:["do not solve","did not solve","not solve"],why:"First conditional: If + present, will + verb."},
 {id:"x6",s:"Young people are getting used to eat unhealthy food.",e:"eat",o:["eating","ate","eaten"],why:"get used to + -ing."},
 {id:"x7",s:"Some people lives far from their workplace.",e:"lives",o:["live","living","is living"],why:"'people' is plural: live."},
 {id:"x8",s:"Obesity become a widely discussed issue.",e:"become",o:["has become","becomes to","becoming"],why:"Present perfect for a change that is still true: has become."},
 {id:"x9",s:"Fast food is popular because it taste better.",e:"taste",o:["tastes","tasting","is taste"],why:"it + tastes."},
 {id:"x10",s:"We can solve this by let the school offer healthy meals.",e:"let the school",o:["asking schools to","let schools to","letting school"],why:"by + -ing: by asking schools to offer."}
];
const GLOSS=[["cause","سبب"],["solution","حل"],["introduction","مقدمة"],["conclusion","خاتمة"],["paraphrase","إعادة صياغة"],["develop an idea","تطوير الفكرة"],["example","مثال"],["result","نتيجة"]];
const STAGES=[["start","Start","ابدأ"],["map","Essay map","خريطة المقال"],["intro","Intros & endings","المقدمة والخاتمة"],["dev","Develop it","طوّر الفكرة"],["struct","Three structures","ثلاثة تراكيب"],["clinic","Sentence clinic","عيادة الجمل"],["spell","Spelling","الإملاء"],["fix","Find and fix","اكتشف وصحح"],["finish","Finish","النهاية"]];
const BADGES=[["map","Map Reader"],["intro","Strong Start"],["dev","Idea Builder"],["struct","Structure Star"],["clinic","Sentence Doctor"],["spell","Spelling Ace"],["fix","Mistake Hunter"],["pass","Essay Fixer"]];
const STAGE_ITEMS={map:MAP.map(m=>m.id),intro:IC.map(i=>i.id),dev:CHAINS.flatMap(c=>c.steps.map((_,k)=>c.id+k)),struct:[...STRUCT.map(s=>s.id),...OWN.map(w=>w.id)],
  clinic:[...RUN.map(r=>r.id),...VERB.map(v=>v.id)],spell:SPELL.map((_,i)=>"sp"+i),fix:FF.flatMap(f=>[f.id+"s",f.id+"c"])};
const ALL=Object.values(STAGE_ITEMS).flat();
const PASS=.8;

/* ===================== STATE ===================== */
const framed=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const fresh=()=>({name:"",stage:"start",pts:0,badges:{},res:{},own:{},shuf:{}});
let state=fresh();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function order(key,n){ if(!state.shuf[key]||state.shuf[key].length!==n) state.shuf[key]=shuffle([...Array(n).keys()]); return state.shuf[key]; }
function save(){ try{localStorage.setItem("efl-state",JSON.stringify(state))}catch(e){} }
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function rec(id,ok,ans){ if(state.res[id]) return state.res[id].ok; state.res[id]={ok,ans}; if(ok) state.pts+=10; checkBadges(); hud(); return ok; }
const done=id=>!!state.res[id];
const stageDone=k=>k==="start"?!!state.name:k==="finish"?!!state.badges.pass:(STAGE_ITEMS[k]||[]).every(done);
const stageScore=k=>{const it=STAGE_ITEMS[k];return[it.filter(i=>state.res[i]&&state.res[i].ok).length,it.length]};
function checkBadges(){ BADGES.forEach(([k,t])=>{ if(state.badges[k]) return;
  const got=k==="pass"?ALL.every(done)&&ALL.filter(i=>state.res[i].ok).length/ALL.length>=PASS:stageDone(k);
  if(got){ state.badges[k]=true; toast("New badge: "+t); confetti(); } }); }
const keep=fn=>{ const y=scrollY; fn(); scrollTo(0,y); };
const M=()=>document.getElementById("main");

/* ===================== SHELL ===================== */
function hud(){
  document.getElementById("pts").textContent=state.pts+" pts";
  document.getElementById("badges").innerHTML=BADGES.map(([k,t])=>`<span class="badge ${state.badges[k]?"on":""}">${state.badges[k]?"★":"☆"} ${t}</span>`).join("");
  document.getElementById("rail").innerHTML=STAGES.map(([k,n,a],i)=>`<button type="button" class="${state.stage===k?"cur":""} ${stageDone(k)?"done":""}" onclick="go('${k}')"><span class="n">${i}</span>${n} <span class="ar opt">${a}</span></button>`).join("");
  save();
}
function go(k){ state.stage=k; render(); window.scrollTo({top:0,behavior:"smooth"}); }
function nextBtn(k,l){ return `<div class="row"><button class="btn main" type="button" onclick="go('${k}')">${l} →</button></div>`; }
function head(t,ar,p){ return `<section class="intro"><h2>${t} <span class="ar opt">${ar}</span></h2><p>${p}</p></section>`; }
const R={};
function render(){ hud(); R[state.stage](M()); }
function pick(it,label,cb,why,extra=""){ const r=state.res[it.id]; const ord=order(it.id,it.o.length);
  return `<div class="item ${r?(r.ok?"ok":"no"):""}" id="it-${it.id}">${extra}${label?`<p class="q">${label}</p>`:""}<div class="opts">${ord.map(j=>{let c=""; if(r){ if(j===0) c="right"; else if(r.ans===j) c="wrong"; }
    return `<button type="button" class="${c}" ${r?"disabled":""} onclick="${cb}('${it.id}',${j})">${esc(it.o[j])}</button>`}).join("")}</div>${r&&why?`<p class="fb ${r.ok?"good":"bad"}"><b>${r.ok?"Correct.":"Not quite."}</b> ${esc(why)}</p>`:""}</div>`; }

/* ===================== 0 START ===================== */
R.start=m=>{
  m.innerHTML=`${head("Practise our essay mistakes","تدرّب على أخطاء مقالاتنا","Every sentence in this app comes from our class's problem-solution essays. You will sort, fix and improve them, one skill at a time.")}
  <div class="map">
    <div class="mapc"><b>1</b><strong>Introduction</strong><span class="note">Paraphrase the question, then the outline sentence.</span></div>
    <div class="mapc"><b>2</b><strong>Causes</strong><span class="note">Two causes (or problems), each developed.</span></div>
    <div class="mapc"><b>3</b><strong>Solutions</strong><span class="note">Two solutions that fix the causes.</span></div>
    <div class="mapc"><b>4</b><strong>Conclusion</strong><span class="note">Sum up. No new ideas. Always finish!</span></div>
  </div>
  <div class="panel"><h3>Key words</h3><div class="gloss">${GLOSS.map(g=>`<span><b>${g[0]}</b><span class="ar">${g[1]}</span></span>`).join("")}</div></div>
  <div class="tip">Each correct first answer earns <b>10 points</b>. Score ${Math.round(PASS*100)}% or more to earn your certificate. Type your name at the top first.</div>

};

/* ===================== 1 MAP ===================== */
R.map=m=>{
  m.innerHTML=`${head("Essay map","خريطة المقال","Where does each sentence belong? Read it carefully: one of them is a trap.")}

     <div class="opts">${PARTS.map((p,j)=>{let c=""; if(r){ if(j===it.a) c="right"; else if(r.ans===j) c="wrong"; } return `<button type="button" class="${c}" ${r?"disabled":""} onclick="mapQ('${it.id}',${j})">${p}</button>`}).join("")}</div>
     ${r?`<p class="fb ${r.ok?"good":"bad"}"><b>${r.ok?"Correct.":"Not quite."}</b> ${esc(it.why)}</p>`:""}</div>`}).join("")}</div>

function mapQ(id,j){ const it=MAP.find(x=>x.id===id); rec(id,j===it.a,j); keep(()=>R.map(M())); }

/* ===================== 2 INTRO & CONCLUSION ===================== */
R.intro=m=>{
  m.innerHTML=`${head("Introductions and conclusions","المقدمة والخاتمة","Only 3 of our 15 introductions had a complete outline sentence, and 4 essays had no conclusion.")}

};

/* ===================== 3 DEVELOP ===================== */
R.dev=m=>{
  m.innerHTML=`${head("Develop it","طوّر الفكرة","Every essay was under 250 words. The fix: give every idea an explanation, an example and a result. Build three paragraphs from our class's ideas.")}
  <div class="tip">Idea → <b>Explain</b> (why?) → <b>Example</b> (for example, …) → <b>Result</b> (as a result, … / If …, … will …)</div>
  ${CHAINS.map(c=>{ const built=[c.idea]; let open=true;
    const steps=c.steps.map(([lab,o],k)=>{ const id=c.id+k, r=state.res[id];
      if(!open) return "";
      if(!r) open=false; else built.push(o[0]);
      const it={id,o}; return pick(it,"",`devQ`,r?(r.ok?"":"The other choices are off-topic or belong in a different paragraph."):"",`<span class="tag">${lab}</span>`); }).join("");
    const n=built.join(" ").split(/\s+/).length;
    return `<div class="panel"><h3>${esc(c.idea)}</h3>${steps}<div class="para"><span class="s1">${esc(built[0])}</span> ${built.slice(1).map(esc).join(" ")}</div><p class="note">${n} words${built.length===4?" · paragraph complete!":""}</p></div>`;}).join("")}

};
function devQ(id,j){ rec(id,j===0,j); keep(()=>R.dev(M())); }

/* ===================== 4 THREE STRUCTURES ===================== */
R.struct=m=>{
  m.innerHTML=`${head("Three structures","ثلاثة تراكيب","These three were the least used in our essays: If … will (3 of 15), should be + past participle (5 of 15), in order to (2 of 15). Choose the correct sentence.")}
  ${["If … will …","should be + past participle","in order to …"].map(k=>`<div class="panel"><h3>${k}</h3><div class="grid2">${STRUCT.filter(s=>s.k===k).map(s=>pick(s,"","stQ",s.why)).join("")}</div></div>`).join("")}
  <div class="panel"><h3>Your turn: write one of each</h3><p class="note">Write about any of our essay topics. The boxes tick when your sentence uses the structure.</p>
   ${OWN.map(w=>{const ok=done(w.id); return `<div class="item ${ok?"ok":""}"><span class="tag">${w.k}</span><textarea class="big" id="${w.id}" placeholder="${esc(w.ph)}" ${ok?"disabled":""}>${esc(state.own[w.id]||"")}</textarea>
     <p class="note">Example: <i>${esc(w.ex)}</i></p>${ok?`<p class="fb good"><b>Great sentence!</b></p>`:`<div class="row"><button class="btn main" type="button" onclick="ownQ('${w.id}')">Check my sentence</button></div>`}</div>`}).join("")}</div>
  ${stageDone("struct")?nextBtn("clinic","Go to the sentence clinic"):""}`;
  OWN.forEach(w=>{ const el=document.getElementById(w.id); if(el&&!el.disabled) el.addEventListener("input",()=>{ state.own[w.id]=el.value; save(); }); });
};
function stQ(id,j){ rec(id,j===0,j); keep(()=>R.struct(M())); }
function ownQ(id){ const w=OWN.find(x=>x.id===id), t=document.getElementById(id).value.trim(); state.own[id]=t;
  if(t.split(/\s+/).length<6){ toast("Write a full sentence (6 words or more)."); return; }
  if(!w.test(t)){ const el=document.getElementById(id); el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
    toast(id==="w1"?"Use: If + present, … will + verb (no 'will' after 'if').":id==="w2"?"Use: should be + past participle (built, taxed, banned …).":"Use: in order to + base verb (reduce, give …)."); return; }
  rec(id,true,t); keep(()=>R.struct(M())); }

/* ===================== 5 SENTENCE CLINIC ===================== */
R.clinic=m=>{
  const vDone=VERB.every(v=>done(v.id));
  m.innerHTML=`${head("Sentence clinic","عيادة الجمل","Two problems from our essays: sentences that run on with commas, and 'sentences' with no main verb. Then some verb patterns.")}
  <div class="panel"><h3>A. Choose the correct version</h3><div class="grid2">${RUN.map((r,n)=>pick(r,`${n+1}.`,"runQ",r.why)).join("")}</div></div>
  <div class="panel"><h3>B. Verb patterns</h3>
   ${VERB.map(v=>{const r=state.res[v.id]; const ord=order(v.id,3);
     return `<p class="sent">${esc(v.s).replace("__",`<select class="in ${r?(r.ok?"ok":"no"):""}" id="${v.id}" ${r?"disabled":""} aria-label="choose"><option value="">…</option>${ord.map(j=>`<option value="${j}" ${r&&r.ans===j?"selected":""}>${esc(v.o[j])}</option>`).join("")}</select>`)}${r&&!r.ok?` <span class="note">→ ${esc(v.o[0])}</span>`:""}</p>`}).join("")}
   ${vDone?"":`<div class="row"><button class="btn main" type="button" onclick="checkVerbs()">Check section B</button></div>`}</div>
  ${stageDone("clinic")?nextBtn("spell","Go to Spelling"):""}`;
};
function runQ(id,j){ rec(id,j===0,j); keep(()=>R.clinic(M())); }
function checkVerbs(){ const a=VERB.map(v=>document.getElementById(v.id).value);
  if(a.some(x=>x==="")){ toast("Choose an answer for every gap first."); return; }
  VERB.forEach((v,i)=>rec(v.id,a[i]==="0",+a[i])); keep(()=>R.clinic(M())); }

/* ===================== 6 SPELLING ===================== */
R.spell=m=>{
  const allDone=SPELL.every((_,i)=>done("sp"+i));
  m.innerHTML=`${head("Spelling","الإملاء","These eight words were misspelt again and again in our essays. Type the correct spelling. Tip: many of them are written in the exam question.")}
  <div class="spell">${SPELL.map(([w,c,ar],i)=>{const r=state.res["sp"+i];
    return `<div class="item ${r?(r.ok?"ok":"no"):""}"><span class="wrongw">${esc(w)}</span><span class="ar">${ar}</span>
     <input class="in ${r?(r.ok?"ok":"no"):""}" id="sp${i}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="correct spelling of ${esc(w)}" value="${r?esc(r.ans):""}" ${r?"disabled":""}>
     ${r&&!r.ok?`<p class="fb bad">Correct: <b>${c}</b></p>`:""}</div>`}).join("")}</div>
  ${allDone?"":`<div class="row"><button class="btn main" type="button" onclick="checkSpell()">Check my spelling</button></div>`}
  ${stageDone("spell")?nextBtn("fix","Go to Find and fix"):""}`;

function checkSpell(){ const a=SPELL.map((_,i)=>document.getElementById("sp"+i).value.trim());
  if(a.some(x=>!x)){ toast("Type all eight words first."); return; }
  SPELL.forEach(([w,c],i)=>rec("sp"+i,a[i].toLowerCase()===c,a[i])); keep(()=>R.spell(M())); }

/* ===================== 7 FIND AND FIX ===================== */
function toks(f){ const i=f.s.indexOf(f.e), pre=f.s.slice(0,i).trim(), post=f.s.slice(i+f.e.length).trim();
  const w=(t,err)=>t?t.split(/\s+/).map(x=>({w:x,err})):[]; return [...w(pre,false),...w(f.e,true),...w(post,false)]; }
R.fix=m=>{
  m.innerHTML=`${head("Find and fix","اكتشف وصحح","Real sentences from our essays. Each has one mistake. Click the wrong word, then choose the correction.")}
  <div class="grid2">${FF.map((f,n)=>{ const rs=state.res[f.id+"s"], rc=state.res[f.id+"c"]; const t=toks(f);
    let h=`<div class="item ${rc?(rs.ok&&rc.ok?"ok":"no"):""}" id="it-${f.id}"><span class="note">${n+1} of ${FF.length}</span>
     <div class="tokline">${t.map((k,i)=>`<button type="button" class="tok ${rs&&k.err?"err":""} ${rs&&rs.ans===i?"picked":""}" ${rs?"disabled":""} onclick="fixSpot('${f.id}',${i})">${esc(k.w)}</button>`).join(" ")}</div>`;
    if(!rs) return h+`<p class="note">Click the mistake.</p></div>`;
    h+=`<p class="fb ${rs.ok?"good":"bad"}"><b>${rs.ok?"You found it!":"Not that word."}</b> The mistake is <b>"${esc(f.e)}"</b>.</p>`;
    const ord=order(f.id,3);
    h+=`<div class="opts">${ord.map(j=>{let c=""; if(rc){ if(j===0) c="right"; else if(rc.ans===j) c="wrong"; } return `<button type="button" class="${c}" ${rc?"disabled":""} onclick="fixPick('${f.id}',${j})">${esc(f.o[j])}</button>`}).join("")}</div>`;
    if(rc) h+=`<p class="fb">${esc(f.why)}<br><b>Correct:</b> ${esc(f.s.replace(f.e,f.o[0]))}</p>`;
    return h+"</div>"; }).join("")}</div>
  ${stageDone("fix")?nextBtn("finish","See my results"):""}`;
};
function fixSpot(id,i){ const f=FF.find(x=>x.id===id); rec(id+"s",toks(f)[i].err,i); keep(()=>R.fix(M())); }
function fixPick(id,j){ rec(id+"c",j===0,j); keep(()=>R.fix(M())); }

/* ===================== 8 FINISH ===================== */

let resetArm=0;
function resetAll(){ if(Date.now()-resetArm>3000){ resetArm=Date.now(); toast("Press again to delete your answers and start again."); return; }
  const n=state.name; state=fresh(); state.name=n; render(); }

/* ===================== FILES ===================== */
const dlReady=(window.claude&&window.claude.use)?window.claude.use("downloads").catch(()=>null):Promise.resolve(null);
async function saveBlob(filename,blob,okMsg){
  const dl=await dlReady;
  if(dl){ try{ await dl.save({filename,data:blob}); toast(okMsg||"Saved"); }
    catch(e){ if(e&&e.code==="declined") return; toast(e&&e.code==="rate_limited"?"Please wait a moment and try again.":"Downloads are not available in this view."); } return; }
  if(framed){ toast("Downloads are not available in this view. Open the app from GitHub Pages."); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast(okMsg||"Saved");
}
const slug=s=>(s||"student").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase()||"student";
const dateStr=()=>new Date().toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
const HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const PC={ink:[.14,.09,.11],muted:[.42,.35,.38],wine:[.478,.129,.259],sage:[.247,.42,.298],line:[.89,.84,.85],white:[1,1,1]};
function pdfStr(s){ return String(s).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-").replace(/…/g,"...").replace(/→/g,"->").replace(/[•·]/g,"·").replace(/[^\x20-\x7E -ÿ]/g,"").replace(/\s+/g," "); }
class PDF{
  constructor(land){ this.W=land?842:595; this.H=land?595:842; this.M=50; this.pages=[]; this.newPage(); }
  newPage(){ this.cur=[]; this.pages.push(this.cur); this.y=this.H-this.M; }
  wid(s,size,font){ let w=0; for(const ch of s){ const c=ch.charCodeAt(0); w+=(c>=32&&c<=126?HW[c-32]:556); } return w*size/1000*(font==="F2"?1.06:1); }
  esc(s){ return s.replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)"); }
  text(x,y,s,size=11,font="F1",col=PC.ink){ s=pdfStr(s); this.cur.push(`BT /${font} ${size} Tf ${col.join(" ")} rg ${x.toFixed(2)} ${y.toFixed(2)} Td (${this.esc(s)}) Tj ET`); }
  center(y,s,size,font,col){ s=pdfStr(s); this.text((this.W-this.wid(s,size,font))/2,y,s,size,font,col); }
  rect(x,y,w,h,fill,stroke,lw=1){ let o=`${lw} w `; if(fill) o+=`${fill.join(" ")} rg `; if(stroke) o+=`${stroke.join(" ")} RG `; o+=`${x} ${y} ${w} ${h} re ${fill&&stroke?"B":fill?"f":"S"}`; this.cur.push(o); }
  line(x1,y1,x2,y2,col=PC.line,lw=.8){ this.cur.push(`${lw} w ${col.join(" ")} RG ${x1} ${y1} m ${x2} ${y2} l S`); }
  wrap(s,size,font,maxW){ const words=pdfStr(s).trim().split(" "); const out=[]; let l=""; for(const w of words){ const t=l?l+" "+w:w; if(this.wid(t,size,font)>maxW&&l){ out.push(l); l=w; } else l=t; } if(l) out.push(l); return out.length?out:[""]; }
  need(h){ if(this.y-h<56) this.newPage(); }
  para(s,{size=11,font="F1",col=PC.ink,gap=8,lead=1.45}={}){ for(const l of this.wrap(s,size,font,this.W-2*this.M)){ this.need(size*lead); this.y-=size*lead; this.text(this.M,this.y,l,size,font,col); } this.y-=gap; }
  footer(title){ const n=this.pages.length; this.pages.forEach((p,i)=>{ this.cur=p; this.line(this.M,34,this.W-this.M,34); this.text(this.M,22,"Designed by: Nazila Motahari  ·  "+title,8.5,"F1",PC.muted); const pg=`Page ${i+1} of ${n}`; this.text(this.W-this.M-this.wid(pg,8.5,"F1"),22,pg,8.5,"F1",PC.muted); }); }
  bytes(){ const objs=[]; const add=s=>{objs.push(s);return objs.length;};
    add("<< /Type /Catalog /Pages 2 0 R >>"); add("PAGES");
    ["Helvetica","Helvetica-Bold","Helvetica-Oblique"].forEach(f=>add(`<< /Type /Font /Subtype /Type1 /BaseFont /${f} /Encoding /WinAnsiEncoding >>`));
    const kids=[]; this.pages.forEach(p=>{ const c=p.join("\n"); const ci=add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);
      kids.push(add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> /Contents ${ci} 0 R >>`)); });
    objs[1]=`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;
    let out="%PDF-1.4\n%âãÏÓ\n"; const off=[];
    objs.forEach((o,i)=>{ off.push(out.length); out+=`${i+1} 0 obj\n${o}\nendobj\n`; });
    const x=out.length; out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("");
    out+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
    const b=new Uint8Array(out.length); for(let i=0;i<out.length;i++) b[i]=out.charCodeAt(i)&255; return new Blob([b],{type:"application/pdf"}); }
}

/* ===================== CONFETTI ===================== */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=document.getElementById("confetti"); c.hidden=false; const x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const css=getComputedStyle(document.documentElement); const cols=["--wine","--sage","--gold","--good"].map(v=>css.getPropertyValue(v).trim());
  const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,s:5+Math.random()*6,r:Math.random()*6,col:cols[Math.floor(Math.random()*4)]}));
  let f=0; (function tick(){ x.clearRect(0,0,c.width,c.height); ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.col;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(++f<150) requestAnimationFrame(tick); else { x.clearRect(0,0,c.width,c.height); c.hidden=true; } })();
}
